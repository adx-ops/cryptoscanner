# Merges agent pull requests automatically when CI is green.
# Scope: branches agent/* with label auto-merge only. Disable this workflow to stop all auto-merges.
name: Auto-merge agent PRs
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
permissions:
  contents: write
  pull-requests: write
  actions: write
jobs:
  merge:
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Find the PR for this run and merge it if it qualifies
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.event.workflow_run.head_sha }}
          REPO: ${{ github.repository }}
        run: |
          prs=$(gh api "repos/$REPO/commits/$SHA/pulls" --jq '.[] | select(.head.ref | startswith("agent/")) | select([.labels[].name] | index("auto-merge")) | .number')
          if [ -z "$prs" ]; then echo "No qualifying agent PR for $SHA"; exit 0; fi
          merged=0
          for n in $prs; do
            echo "Merging PR #$n"
            gh pr merge "$n" --repo "$REPO" --squash --delete-branch && merged=1
          done
          # A merge made with GITHUB_TOKEN does not trigger push workflows, so start the deploy explicitly.
          if [ "$merged" = "1" ]; then
            gh workflow run deploy-pages.yml --repo "$REPO" --ref main && echo "Deploy triggered"
            gh workflow run ci.yml --repo "$REPO" --ref main || true
          fi
