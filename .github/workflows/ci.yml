# Continuous checks: data validation, unit tests, type check, static build, UI checks.
# Runs on every push and pull request. Free on GitHub-hosted runners for public repos
# and within the free minutes for private ones (verify current quotas before relying on it).
name: CI
permissions:
  contents: write
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Each step appends its output to the job summary, which is readable through the API
      # (raw logs are not reachable from Claude's environment).
      - name: Validate data
        run: set -o pipefail; npm run validate 2>&1 | tee -a step.log
      - name: Unit tests
        run: set -o pipefail; npm test 2>&1 | tail -20 | tee -a step.log
      - name: Type check
        run: set -o pipefail; npm run check 2>&1 | tee -a step.log
      - name: Build (demo dataset)
        run: set -o pipefail; npm run build 2>&1 | tee -a step.log
      - name: Install Chromium for Playwright
        run: npx playwright install --with-deps chromium
      - name: UI checks (Chromium, 5 widths + interactions)
        run: set -o pipefail; npm run ui-check 2>&1 | tee -a step.log
      - name: Build (verified dataset, Pages layout)
        env:
          PUBLIC_DATASET: verified
          PUBLIC_SITE_URL: https://adx-ops.github.io
          PUBLIC_BASE_PATH: /cryptoscanner
          PUBLIC_NOINDEX: "1"
        run: set -o pipefail; npx astro build 2>&1 | tee -a step.log
      - name: Publish step output (job summary + commit comment on failure)
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          { echo '## Step output (last 120 lines)'; echo '```'; tail -120 step.log 2>/dev/null; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          if [ "${{ job.status }}" != "success" ]; then
            body="CI failed on $GITHUB_SHA (run $GITHUB_RUN_ID). Last lines:\n\n\`\`\`\n$(tail -60 step.log | grep -E 'FAIL|ERROR|error|Error' | tail -40)\n\`\`\`"
            gh api "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/comments" -f body="$(printf "$body")" >/dev/null || true
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screenshots
          path: docs/screenshots/*.png
          if-no-files-found: ignore
