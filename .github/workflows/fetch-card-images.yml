name: Fetch card images
# Downloads official card imagery recorded in data/images/manifest.json (the cloud workspace cannot
# reach the providers' CDNs) and opens an auto-merged PR with the resized files.
on:
  push:
    branches: [main]
    paths: ['data/images/manifest.json', 'scripts/fetch-card-images.mjs']
  workflow_dispatch:
    inputs:
      force:
        description: Re-download every image
        type: boolean
        default: false
  schedule:
    - cron: '41 4 * * 1'
permissions:
  contents: write
  pull-requests: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm i --no-save sharp
      - run: node scripts/fetch-card-images.mjs ${{ inputs.force && '--force' || '' }}
      - uses: peter-evans/create-pull-request@v7
        with:
          branch: agent/card-images
          title: 'Card images: fetched from official sources'
          commit-message: 'Card images fetched from the official pages recorded in data/images/manifest.json'
          body: 'Automated download of the images recorded in `data/images/manifest.json` (source page, asset URL and access date per entry). Resized to ≤1400px WebP.'
          labels: auto-merge
          add-paths: public/card-images
