# Builds the VERIFIED dataset and deploys it to GitHub Pages on every merge to main.
# Requires (once, by David): repo Settings → Pages → Source: "GitHub Actions".
# Until a real domain exists the site is served at https://adx-ops.github.io/cryptoscanner/ with
# robots noindex (PUBLIC_NOINDEX=1), so nothing is indexed before launch.
name: Deploy (verified build)
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run validate
      - name: Build verified dataset for GitHub Pages
        env:
          PUBLIC_DATASET: verified
          PUBLIC_SITE_URL: https://adx-ops.github.io
          PUBLIC_BASE_PATH: /cryptoscanner
          PUBLIC_NOINDEX: "1"
        run: npx astro build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
